[package]
name = "echo-clips-desktop"
version = "0.1.0"
description = "Tray-first clipboard sync panel for Echo Clips"
authors = ["Zhuanz"]
edition = "2021"

[lib]
name = "echo_clips_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.5"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
