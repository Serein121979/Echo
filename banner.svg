      <animate attributeName="ry" values="40;90" dur="3s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="stroke-width" values="2;0.3" dur="3s" repeatCount="indefinite" begin="0s"/>
    </ellipse>

    <ellipse cx="450" cy="140" rx="40" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0" filter="url(#ringGlow)">
      <animate attributeName="rx" values="40;160" dur="3s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="ry" values="40;90" dur="3s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="stroke-width" values="2;0.3" dur="3s" repeatCount="indefinite" begin="0.75s"/>
