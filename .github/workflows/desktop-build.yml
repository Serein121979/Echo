name: Build Echo Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            target: ""
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: clips-desktop
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: clips-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust build target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clips-desktop/src-tauri
      - name: Verify build configuration
        shell: bash
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Install desktop dependencies
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clips-desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v6
        with:
          name: echo-desktop-${{ matrix.platform }}
          path: |
            clips-desktop/src-tauri/target/**/release/bundle/**/*.dmg
            clips-desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            clips-desktop/src-tauri/target/**/release/bundle/**/*.msi
            clips-desktop/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: error
